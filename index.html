<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: 홈 화면에 추가해 앱처럼 열면 노치 아래까지 화면이 쓰인다.
         maximum-scale은 두지 않는다 — 읽기 앱에서 확대를 막으면 안 된다. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Daily Read</title>
    <meta name="description" content="매일 10~30분, 좋은 출처의 영어 글을 읽고 모르는 단어를 바로 찾아본다" />
    <meta name="theme-color" content="#faf9f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#171614" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <!-- 사파리에서 '홈 화면에 추가'로 열었을 때 주소창 없이 앱처럼 뜬다. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Daily Read" />

    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
